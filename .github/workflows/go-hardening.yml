name: go-hardening

# Builds and verifies the Go anti-reversing demo (go/). Runs on Windows because
# the hardening uses cgo (MinGW) + the Windows anti-debug / PE integrity probes,
# and garble must produce a native windows/amd64 binary.
#
# Only the go/ project is covered: the VMP/research units depend on 30+ MB of
# fetched VMProtect samples and on Triton, so they are not CI-runnable here.

on:
  push:
    branches: [master]
    paths: ["go/**", ".github/workflows/go-hardening.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/go-hardening.yml"]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: go
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go/go.mod

      - name: Show toolchain
        run: |
          go version
          gcc --version

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest
          $gobin = "$(go env GOPATH)\bin"
          # Expose on PATH for subsequent steps; use full path to verify in THIS step.
          $gobin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$gobin\garble.exe" version

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: End-to-end acceptance (verify.ps1)
        shell: powershell
        run: .\scripts\verify.ps1

      - name: Sanity-check the plain build too
        shell: powershell
        run: .\scripts\verify.ps1 -Dev
